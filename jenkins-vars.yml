---

# jenkins variables
project_name: docker-python
external_type: na
custom_version_command: "echo $(curl -fsL https://raw.githubusercontent.com/home-assistant/docker/refs/heads/master/Dockerfile | grep 'ARG BUILD_FROM=' | cut -d: -f2 | sed -E 's|.*-(alpine.*)-.*|\\\\1|' | sed 's|\\\\.||')-$(curl -fsL https://raw.githubusercontent.com/home-assistant/docker-base/refs/heads/master/python/$(curl -fsL https://raw.githubusercontent.com/home-assistant/docker/refs/heads/master/Dockerfile | grep 'ARG BUILD_FROM=' | cut -d: -f2 | sed -E 's|([0-9\\\\.]+)-alpine.*|\\\\1|')/Dockerfile | grep 'ARG PYTHON_VERSION=' | sed 's|.*PYTHON_VERSION=||')"
release_type: prerelease
release_tag: ha
ls_branch: ha
skip_package_check: true
unraid_template_sync: false
unraid_template: false
repo_vars:
  - BUILD_VERSION_ARG = 'OS_PYTHON_VERSION'
  - LS_USER = 'linuxserver'
  - LS_REPO = 'docker-python'
  - CONTAINER_NAME='python'
  - DOCKERHUB_IMAGE = 'linuxserver/python'
  - DEV_DOCKERHUB_IMAGE = 'lsiodev/python'
  - PR_DOCKERHUB_IMAGE = 'lspipepr/python'
  - DIST_IMAGE = 'alpine'
  - MULTIARCH='true'
  - CI='false'
  - CI_WEB='false'
  - CI_PORT='8090'
  - CI_SSL='false'
  - CI_DELAY='120'
  - CI_DOCKERENV='TZ=US/Pacific'
  - CI_AUTH='user:password'
  - CI_WEBPATH=''
